name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [buyer, vendor]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [buyer, vendor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug
